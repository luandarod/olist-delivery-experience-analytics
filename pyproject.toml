[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olist-delivery-experience-analytics"
version = "0.1.0"
description = "Reproducible analytics pipeline for Olist delivery experience modeling."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.5",
]

[project.scripts]
olist-analytics-pipeline = "olist_delivery_experience_analytics.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
